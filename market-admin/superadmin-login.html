<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin — Yield Matrix</title>
  <meta name="description" content="Super admin login for Yield Matrix market portal district management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .sa-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.3);
      color: #a855f7; border-radius: 999px; font-size: 11px; font-weight: 700;
      padding: 3px 10px; letter-spacing: 0.04em; text-transform: uppercase;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="login-page">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4L36 13V27L20 36L4 27V13L20 4Z" stroke="url(#gs)" stroke-width="2" fill="none"/>
          <path d="M20 12L28 17V23L20 28L12 23V17L20 12Z" fill="url(#gs)" opacity="0.6"/>
          <defs>
            <linearGradient id="gs" x1="4" y1="4" x2="36" y2="36">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1 class="brand-name" style="background:linear-gradient(135deg,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">Yield Matrix</h1>
        <p class="brand-sub">Super Admin Portal</p>
      </div>
    </div>

    <div class="glass-card login-card">
      <div class="sa-badge">🔐 Superadmin Access</div>
      <h2 class="card-title">Admin Login</h2>
      <p class="card-desc">Sign in with superadmin credentials to manage district accounts.</p>

      <form id="saLoginForm" autocomplete="off" novalidate>
        <div class="field-group">
          <label for="saUsername" class="field-label">Username</label>
          <input type="text" id="saUsername" class="field-input" placeholder="superadmin" value="superadmin" required />
        </div>

        <div class="field-group">
          <label for="saPassword" class="field-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="saPassword" class="field-input" placeholder="Enter superadmin password" required />
            <button type="button" id="toggleSaPwd" class="toggle-pwd" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="saError" class="error-msg" hidden></div>

        <button type="submit" id="saLoginBtn" class="btn-primary" style="background:linear-gradient(135deg,#a855f7,#22d3ee);">
          <span id="saLoginText">Sign In as Superadmin</span>
          <span id="saSpinner" class="spinner" hidden></span>
        </button>
      </form>
    </div>

    <p style="text-align:center;font-size:0.75rem;color:var(--text-3);margin-top:16px;">
      <a href="index.html" style="color:var(--text-2);text-decoration:none;">← Back to District Login</a>
    </p>
  </main>

  <script src="js/superadmin.js"></script>
</body>
</html>
