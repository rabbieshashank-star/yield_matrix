<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Yield Matrix</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f4f7fb;
            margin: 0;
        }
        .offline-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.1);
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .offline-card h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .offline-card p {
            font-size: 1rem;
            color: #53617a;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .offline-card a {
            display: inline-block;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        .offline-card a:hover {
            background: #219150;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <h1 data-i18n="offline_title">📴 You are offline</h1>
        <p data-i18n="offline_message">Yield Matrix is currently offline. The app is still available with cached pages and tools you previously visited.</p>
        <a href="index.html" data-i18n="go_home">Go back to Home</a>
    </div>
    <script src="js/i18n.js"></script>
</body>
</html>
